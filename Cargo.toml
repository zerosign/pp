[workspace]
resolver = "3"
members = ["crates/pp", "crates/pp-cli", "crates/pp-nvim"]

[workspace.lints.clippy]
pedantic = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
rayon = "1.10"
fst = "0.4"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }
mimalloc = "0.1"
