[package]
name = "pp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive pp picker (skim) + CLI subcommands"

[[bin]]
name = "pp"
path = "src/bin/pp.rs"

[dependencies]
pp = { path = "../pp" }
clap.workspace = true
clap_complete.workspace = true
dialoguer.workspace = true
mimalloc = { workspace = true, optional = true }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true
